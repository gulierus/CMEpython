[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cmepython"
version = "0.1.0"
description = "Python port of the dynamin (slave-channel) intensity measurement from cmeAnalysis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Ruslan Guliev" }]
keywords = ["microscopy", "TIRF", "endocytosis", "clathrin", "dynamin", "cmeAnalysis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Zamerne jen numpy/scipy/tifffile -- zadna kompilovana rozsireni ani MATLAB,
# aby balik bezel na Windows, Linuxu i obou generacich Macu.
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "tifffile>=2021.11.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/gulierus/CMEpython"
Upstream = "https://github.com/DanuserLab/cmeAnalysis"

[tool.setuptools]
packages = ["cmepython"]

[tool.pytest.ini_options]
testpaths = ["tests"]
